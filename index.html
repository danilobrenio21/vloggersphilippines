<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Vloggers Philippines | Independent Media & Pop Culture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --card-hover: #1c1c1c;
      --accent-yellow: #facc15;
      --yellow-glow: rgba(250, 204, 21, 0.25);
      --text-white: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --border-accent: rgba(250, 204, 21, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      width: 100%;
    }

    .glow-bg {
      position: fixed;
      top: -150px;
      right: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--yellow-glow) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-white);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .brand-badge {
      background: var(--accent-yellow);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 14px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 4px 0;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: var(--accent-yellow);
    }

    .btn-action {
      background: transparent;
      border: 1.5px solid var(--accent-yellow);
      color: var(--accent-yellow) !important;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      background: var(--accent-yellow);
      color: #000 !important;
      box-shadow: 0 0 12px var(--yellow-glow);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .filter-wrapper {
      position: relative;
      margin-bottom: 28px;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 15px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
      font-weight: 700;
    }

    .tag-yellow {
      display: inline-block;
      color: var(--accent-yellow);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--accent-yellow);
      border-radius: 2px;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .article-card:hover {
      background: var(--card-hover);
      border-color: var(--border-accent);
      transform: translateY(-3px);
    }

    .article-thumb {
      width: 100%;
      height: 190px;
      background: #1a1a1a;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border);
    }

    .article-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .article-content h3 {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
      margin: 6px 0 10px 0;
    }

    .article-content h3 a {
      color: var(--text-white);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .article-content h3 a:hover {
      color: var(--accent-yellow);
    }

    .article-content p {
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .article-meta {
      margin-top: auto;
      font-size: 0.78rem;
      color: #71717a;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    footer {
      border-top: 1px solid var(--border);
      background: #080808;
      padding: 40px 20px 24px;
      margin-top: 50px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    @media (min-width: 768px) {
      .nav-container { padding: 18px 24px; }
      .brand { font-size: 1.5rem; }
      main { padding: 40px 24px; }
      .articles-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 28px;
      }
      .article-thumb { height: 200px; }
      .article-content { padding: 22px; }
      .article-content h3 { font-size: 1.25rem; }
      .section-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        VLOGGERS <span class="brand-badge">PH</span>
      </a>
      <nav>
        <a href="directory.html">Directory</a>
        <a href="creators.html">Creators</a>
        <a href="film.html">Film & TV</a>
        <a href="pop-culture.html">Pop Culture</a>
        <a href="tech.html">Tech</a>
        <a href="admin.html" class="btn-action">+ Post Article</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="filter-wrapper">
      <div class="filter-bar">
        <a href="index.html" class="filter-btn active">All Feed</a>
        <a href="directory.html" class="filter-btn">Creators Directory</a>
        <a href="creators.html" class="filter-btn">Influencer Culture</a>
        <a href="film.html" class="filter-btn">Film & Production</a>
        <a href="pop-culture.html" class="filter-btn">Pop Trends</a>
        <a href="tech.html" class="filter-btn">Gear Reviews</a>
      </div>
    </div>

    <div class="section-title">Latest Dispatches & Stories</div>
    
    <!-- Dynamic Container: Supabase injects published stories here -->
    <div class="articles-grid" id="feedContainer">
      <div id="loadingText" style="color: var(--text-muted); font-size: 0.9rem;">Fetching latest stories...</div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 <strong>Vloggers Philippines</strong>. Independent Creator, Film & Pop Culture Media.</p>
  </footer>

  <!-- Supabase Live Feed Integration -->
  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_PUBLIC_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadLiveFeed() {
      const container = document.getElementById('feedContainer');
      const loader = document.getElementById('loadingText');

      try {
        const { data: articles, error } = await supabase
          .from('articles')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (loader) loader.remove();

        if (!articles || articles.length === 0) {
          container.innerHTML = `<p style="color: var(--text-muted);">No stories published yet. Visit <a href="admin.html" style="color: var(--accent-yellow);">Writer Desk</a> to post one!</p>`;
          return;
        }

        container.innerHTML = '';
        articles.forEach(article => {
          const card = document.createElement('article');
          card.className = 'article-card';
          
          const formattedDate = new Date(article.created_at).toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            year: 'numeric' 
          });

          card.innerHTML = `
            <div class="article-thumb" style="background-image: url('${article.cover_image}');"></div>
            <div class="article-content">
              <span class="tag-yellow">${article.category}</span>
              <h3><a href="article-view.html?id=${article.id}">${article.title}</a></h3>
              <p>${article.summary}</p>
              <div class="article-meta">
                <span>By ${article.author}</span>
                <span>${formattedDate}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error fetching articles:', err);
        if (loader) loader.innerText = 'Unable to load stories at this time.';
      }
    }

    loadLiveFeed();
  </script>

</body>
</html>
