<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Writer Portal | Vloggers Philippines</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --accent-yellow: #facc15;
      --yellow-glow: rgba(250, 204, 21, 0.25);
      --text-white: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --border-accent: rgba(250, 204, 21, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-white); line-height: 1.6; }
    
    header { position: sticky; top: 0; z-index: 100; background: rgba(10, 10, 10, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .nav-container { max-width: 900px; margin: 0 auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-white); text-decoration: none; }
    .brand span { background: var(--accent-yellow); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; margin-left: 6px; }
    
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
    .tag { color: var(--accent-yellow); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: inline-block; }
    h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 24px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-white); }
    input[type="text"], select, textarea { width: 100%; background: #0a0a0a; border: 1px solid var(--border); color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-yellow); box-shadow: 0 0 10px var(--yellow-glow); }
    
    .file-drop { border: 2px dashed var(--border); border-radius: 8px; padding: 22px; text-align: center; cursor: pointer; background: #0d0d0d; transition: border-color 0.2s; }
    .file-drop:hover { border-color: var(--accent-yellow); }
    .preview-box { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; margin-top: 12px; display: none; border: 1px solid var(--border); }
    
    .btn-submit { width: 100%; background: var(--accent-yellow); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; margin-top: 10px; }
    .btn-submit:hover { box-shadow: 0 0 15px var(--yellow-glow); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .status { margin-top: 14px; font-size: 0.9rem; text-align: center; font-weight: 600; display: none; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">VLOGGERS <span>WRITER DESK</span></a>
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">← Live Site</a>
    </div>
  </header>

  <main>
    <span class="tag">Editorial Desk</span>
    <h1>Post an Article</h1>

    <div class="card">
      <form id="postForm">
        <div class="form-group">
          <label>Headline</label>
          <input type="text" id="title" placeholder="Enter story title..." required>
        </div>

        <div class="form-group">
          <label>Author / Byline</label>
          <input type="text" id="author" placeholder="e.g., Editorial Staff" required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="Creators & Economy">Creators & Economy</option>
            <option value="Film & TV">Film & TV</option>
            <option value="Pop Culture">Pop Culture</option>
            <option value="Tech & Gear">Tech & Gear</option>
          </select>
        </div>

        <div class="form-group">
          <label>Cover Photo (Auto-Compressed to Web Size)</label>
          <div class="file-drop" onclick="document.getElementById('coverFile').click()">
            <span id="fileLabel">📁 Click to select cover image</span>
            <input type="file" id="coverFile" accept="image/*" style="display: none;" onchange="handlePreview(event)" required>
          </div>
          <img id="preview" class="preview-box" alt="Cover Preview" />
        </div>

        <div class="form-group">
          <label>Summary / Excerpt</label>
          <input type="text" id="summary" placeholder="Brief 1-2 sentence preview for feed..." required>
        </div>

        <div class="form-group">
          <label>Full Story Content</label>
          <textarea id="body" rows="10" placeholder="Write full article here..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">⚡ Publish Article</button>
        <div id="status" class="status"></div>
      </form>
    </div>
  </main>

  <script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_PUBLIC_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Client-Side Image Compressor (Keeps storage under free tier limits)
    async function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(maxWidth / img.width, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Image compression failed"));
              },
              'image/jpeg',
              quality
            );
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // 3. Handle File Input & Preview
    function handlePreview(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('fileLabel').innerText = `Selected: ${file.name}`;
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    // 4. Submit & Publish Flow
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const file = document.getElementById('coverFile').files[0];

      try {
        btn.disabled = true;
        btn.innerText = "Optimizing & Uploading...";
        status.style.display = "block";
        status.style.background = "#18181b";
        status.style.color = "#facc15";
        status.innerText = "⏳ Compressing image for fast web delivery...";

        // Step A: In-browser image compression
        const compressedBlob = await compressImage(file);
        const fileName = `${Date.now()}_cover.jpg`;

        // Step B: Upload to Supabase Storage
        status.innerText = "⏳ Uploading image to storage bucket...";
        const { error: uploadError } = await supabase.storage
          .from('article-images')
          .upload(fileName, compressedBlob, {
            contentType: 'image/jpeg',
            upsert: false
          });

        if (uploadError) throw uploadError;

        // Step C: Get Public CDN URL
        const { data: { publicUrl } } = supabase.storage
          .from('article-images')
          .getPublicUrl(fileName);

        // Step D: Insert Article Record into PostgreSQL
        status.innerText = "⏳ Saving story metadata...";
        const { error: insertError } = await supabase
          .from('articles')
          .insert([
            {
              title: document.getElementById('title').value.trim(),
              author: document.getElementById('author').value.trim(),
              category: document.getElementById('category').value,
              summary: document.getElementById('summary').value.trim(),
              body: document.getElementById('body').value.trim(),
              cover_image: publicUrl
            }
          ]);

        if (insertError) throw insertError;

        // Step E: Success Feedback
        status.style.color = "#4ade80";
        status.style.background = "rgba(74, 222, 128, 0.1)";
        status.innerText = "✅ Article published live across the site!";
        document.getElementById('postForm').reset();
        document.getElementById('preview').style.display = 'none';
        document.getElementById('fileLabel').innerText = "📁 Click to select cover image";
      } catch (err) {
        console.error(err);
        status.style.color = "#ef4444";
        status.style.background = "rgba(239, 68, 68, 0.1)";
        status.innerText = `❌ Error: ${err.message || "Failed to publish"}`;
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ Publish Article";
      }
    });
  </script>
</body>
</html>
